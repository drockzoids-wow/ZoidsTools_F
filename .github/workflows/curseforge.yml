name: Upload Forever release to CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r Tests/requirements.txt
      - name: Test before upload
        run: |
          python Tests/smoke.py
          python Tests/package_test.py
          python Tests/curseforge_test.py
      - name: Upload to Forever project 1700355
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python Tools/upload_curseforge.py
