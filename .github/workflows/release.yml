name: Release Forever addon

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: forever-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r Tests/requirements.txt
      - name: Test before release
        run: |
          python Tests/smoke.py
          python Tests/package_test.py
          python Tests/curseforge_test.py
      - name: Package matching version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python Tools/package.py --tag "$RELEASE_TAG"
      - name: Upload to Forever CurseForge project 1700355
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python Tools/upload_curseforge.py
      - name: Publish GitHub release with addon ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          options=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.zip "${options[@]}"
