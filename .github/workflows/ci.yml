name: Check addon

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r Tests/requirements.txt
      - name: Check Lua and behavior
        run: python Tests/smoke.py
      - name: Check Completionist and migration
        run: python Tests/completionist.py
      - name: Check quest inventory and source coverage
        run: python Tests/quest_data.py
      - name: Check Lua memory budgets
        run: python Tests/memory.py
      - name: Validate addon packaging without an archive
        run: python Tools/package.py --validate-only
      - name: Test CurseForge destination checks
        run: python Tests/curseforge_test.py
