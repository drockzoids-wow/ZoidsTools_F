name: Check addon

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r Tests/requirements.txt
      - name: Check Lua and behavior
        run: python Tests/smoke.py
      - name: Test addon packaging
        run: python Tests/package_test.py
      - name: Test CurseForge destination checks
        run: python Tests/curseforge_test.py
      - name: Build installable addon
        run: python Tools/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: ZoidsTools_F-addon
          path: dist/*.zip
          if-no-files-found: error
